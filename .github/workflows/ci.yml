name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: test-only-key-not-for-production
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
      DB_URL: postgres://industrial_ai_lab:industrial_ai_lab@127.0.0.1:5432/industrial_ai_lab_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: industrial_ai_lab
          POSTGRES_PASSWORD: industrial_ai_lab
          POSTGRES_DB: industrial_ai_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industrial_ai_lab -d industrial_ai_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node ace migration:run --force
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
